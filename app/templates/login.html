{% extends "base.html" %}
{% block title %}{{ s("登录") }} · {{ SITE_NAME }}{% endblock %}
{% block content %}
<section>
  <div class="narrow">
    <h1>{{ t("登录") }}</h1>
    <form class="stack panel" method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label>{{ t("邮箱") }} <input type="email" name="email" required autocomplete="email"></label>
      <label>{{ t("密码") }} <input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn primary" type="submit">{{ t("登录") }}</button>
      <p class="hint">{{ t("还没有账号？", inline=True) }} <a href="/register">{{ t("注册", inline=True) }}</a></p>
    </form>
  </div>
</section>
{% endblock %}
